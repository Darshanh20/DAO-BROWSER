<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAO Browser History Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { margin: 5px; padding: 8px 15px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>DAO Browser History Debug Tool</h1>
    
    <div class="section">
        <h2>Profile Management</h2>
        <button onclick="listProfiles()">List Profiles</button>
        <button onclick="getActiveProfile()">Get Active Profile</button>
        <div id="profile-results"></div>
    </div>
    
    <div class="section">
        <h2>History Testing</h2>
        <button onclick="addTestHistory()">Add Test History</button>
        <button onclick="getHistory()">Get Current Profile History</button>
        <button onclick="clearTestData()">Clear Test Data</button>
        <div>
            <label>Profile ID: <input type="number" id="profileId" value="1" min="1"></label>
        </div>
        <div id="history-results"></div>
    </div>
    
    <div class="section">
        <h2>Real-time Monitoring</h2>
        <button onclick="startMonitoring()">Start Monitoring</button>
        <button onclick="stopMonitoring()">Stop Monitoring</button>
        <div id="monitoring-results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let monitoringInterval = null;
        
        function log(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`);
            
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            
            return div;
        }
        
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function listProfiles() {
            const result = await apiCall('/profiles');
            const div = document.getElementById('profile-results');
            div.innerHTML = '';
            
            if (result.success) {
                div.appendChild(log(`Found ${result.data.count} profiles`));
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(result.data.data, null, 2);
                div.appendChild(pre);
            } else {
                div.appendChild(log(`Error: ${result.error || 'Unknown error'}`, true));
            }
        }
        
        async function getActiveProfile() {
            const result = await apiCall('/profiles/active');
            const div = document.getElementById('profile-results');
            
            if (result.success) {
                div.appendChild(log(`Active profile: ${result.data.data.display_name} (ID: ${result.data.data.id})`));
                
                // Store in localStorage for consistency
                localStorage.setItem('dao_current_profile_id', result.data.data.id.toString());
                document.getElementById('profileId').value = result.data.data.id;
            } else {
                div.appendChild(log(`Error getting active profile: ${result.error}`, true));
            }
        }
        
        async function addTestHistory() {
            const profileId = parseInt(document.getElementById('profileId').value);
            const timestamp = Date.now();
            
            const testEntry = {
                url: `https://test-site-${timestamp}.com`,
                title: `Test Page ${timestamp}`,
                profile_id: profileId
            };
            
            const result = await apiCall('/history/add', {
                method: 'POST',
                body: JSON.stringify(testEntry)
            });
            
            const div = document.getElementById('history-results');
            
            if (result.success) {
                div.appendChild(log(`✅ Added history: ${testEntry.title} (Profile: ${profileId})`));
            } else {
                div.appendChild(log(`❌ Failed to add history: ${result.error}`, true));
            }
        }
        
        async function getHistory() {
            const profileId = parseInt(document.getElementById('profileId').value);
            
            const result = await apiCall(`/history/all?profile_id=${profileId}&limit=10`);
            const div = document.getElementById('history-results');
            
            if (result.success) {
                div.appendChild(log(`Found ${result.data.data.length} history entries for profile ${profileId}`));
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(result.data.data, null, 2);
                div.appendChild(pre);
            } else {
                div.appendChild(log(`Error: ${result.error}`, true));
            }
        }
        
        async function clearTestData() {
            // This would require implementing a clear API endpoint
            const div = document.getElementById('history-results');
            div.appendChild(log('Clear function not implemented yet. Manually delete test entries if needed.'));
        }
        
        function startMonitoring() {
            if (monitoringInterval) return;
            
            const div = document.getElementById('monitoring-results');
            div.innerHTML = '';
            div.appendChild(log('🔍 Starting real-time monitoring...'));
            
            monitoringInterval = setInterval(async () => {
                const profileId = parseInt(document.getElementById('profileId').value);
                const result = await apiCall(`/history/all?profile_id=${profileId}&limit=5`);
                
                if (result.success) {
                    const count = result.data.data.length;
                    const total = result.data.pagination.total;
                    div.appendChild(log(`📊 Profile ${profileId}: ${count} recent entries, ${total} total`));
                    
                    // Keep only last 10 monitoring messages
                    const messages = div.children;
                    while (messages.length > 10) {
                        div.removeChild(messages[1]); // Keep the "Starting monitoring" message
                    }
                }
            }, 5000);
        }
        
        function stopMonitoring() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
                
                const div = document.getElementById('monitoring-results');
                div.appendChild(log('⏹️ Monitoring stopped'));
            }
        }
        
        // Auto-load active profile on page load
        window.addEventListener('load', () => {
            getActiveProfile();
        });
    </script>
</body>
</html>

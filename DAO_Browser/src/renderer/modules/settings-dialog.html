<!-- Settings Dialog Modal -->
<div id="settings-dialog" class="modal hidden">
    <div class="modal-content settings-modal">
        <div class="modal-header">
            <h2>Settings</h2>
            <button id="close-settings-btn" class="close-modal-btn" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body settings-modal-body">
            <div class="settings-menu">
                <button class="settings-menu-item active" data-page="general">
                    <i class="fa-solid fa-gear"></i>
                    <span>General</span>
                </button>
                <button class="settings-menu-item" data-page="shortcuts">
                    <i class="fa-solid fa-keyboard"></i>
                    <span>Keyboard Shortcuts</span>
                </button>
                <button class="settings-menu-item" data-page="privacy">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Privacy & Security</span>
                </button>
                <button class="settings-menu-item" data-page="about">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>About</span>
                </button>
            </div>
            <div class="settings-content">
                <!-- General Page -->
                <div id="general-page" class="settings-page active">
                    <h3>General Settings</h3>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked>
                            <span>Remember browsing history</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked>
                            <span>Enable JavaScript</span>
                        </label>
                    </div>
                </div>

                <!-- Shortcuts Page -->
                <div id="shortcuts-page" class="settings-page">
                    <h3>Keyboard Shortcuts</h3>
                    <p class="page-description">All keyboard shortcuts will open in a new tab for better readability.</p>
                    <button id="open-shortcuts-tab" class="btn-primary">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> View All Shortcuts
                    </button>
                </div>

                <!-- Privacy Page -->
                <div id="privacy-page" class="settings-page">
                    <h3>Privacy & Security</h3>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" checked>
                            <span>Enable Ad Blocker</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox">
                            <span>Block Tracking Scripts</span>
                        </label>
                    </div>
                </div>

                <!-- About Page -->
                <div id="about-page" class="settings-page">
                    <h3>About D.A.O. Browser</h3>
                    <div class="about-content">
                        <p><strong>Version:</strong> 1.0.0</p>
                        <p><strong>Based on:</strong> Electron + Chrome</p>
                        <p><strong>Philosophy:</strong> Private • Decentralized • Secure</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

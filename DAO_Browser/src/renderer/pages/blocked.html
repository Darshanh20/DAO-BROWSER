<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Site Blocked - D.A.O. Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 40px;
            position: relative;
        }

        /* Container for centered content */
        .blocked-container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #3a1a1a;
            border-radius: 20px;
            padding: 8px 16px;
            margin-bottom: 32px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e74c3c;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #e74c3c;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Title */
        h1 {
            font-size: 42px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        /* Subtitle */
        .subtitle {
            font-size: 15px;
            color: #555555;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        /* URL row */
        .url-section {
            width: 100%;
            margin-bottom: 32px;
            text-align: left;
        }

        .url-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555555;
            margin-bottom: 8px;
            display: block;
        }

        .url-display {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #666666;
            padding-left: 16px;
            border-left: 2px solid #2a2a2a;
            word-break: break-all;
            line-height: 1.5;
        }

        /* Thin divider */
        .divider {
            width: 40px;
            height: 1px;
            background: #1e1e1e;
            margin: 0 auto 32px;
        }

        /* Reason row */
        .reason-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 48px;
            text-align: left;
        }

        .reason-icon {
            font-size: 16px;
            color: #8a4040;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .reason-text {
            font-size: 13px;
            color: #8a4040;
            line-height: 1.5;
        }

        /* Go Back Safely button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #c8f542;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-back:hover {
            background: #0f1a00;
            border-color: #c8f542;
        }

        .btn-back:active {
            opacity: 0.85;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #2a2a2a;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 20px;
            }

            .blocked-container {
                max-width: 100%;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
                max-width: 100%;
                margin-bottom: 32px;
            }

            .url-section {
                margin-bottom: 24px;
            }

            .url-label {
                font-size: 10px;
            }

            .url-display {
                font-size: 12px;
                padding-left: 12px;
            }

            .reason-row {
                margin-bottom: 40px;
            }

            .reason-text {
                font-size: 12px;
            }

            .btn-back {
                padding: 10px 20px;
                font-size: 13px;
            }

            .footer {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="blocked-container">
        <!-- Status Pill -->
        <div class="status-pill">
            <span class="status-dot"></span>
            Access Blocked
        </div>

        <!-- Title -->
        <h1>Site Blocked</h1>

        <!-- Subtitle -->
        <p class="subtitle">This page has been restricted by your browser's content filter.</p>

        <!-- URL Section -->
        <div class="url-section">
            <label class="url-label">URL</label>
            <div class="url-display" id="blocked-url-display">Unknown</div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Reason Row -->
        <div class="reason-row">
            <i class="fas fa-triangle-exclamation reason-icon"></i>
            <div class="reason-text">Inappropriate content detected</div>
        </div>

        <!-- Go Back Button -->
        <button class="btn-back" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
            Go Back Safely
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">Protected by D.A.O. Browser</div>

    <script>
        // Extract blocked URL from query params
        const params = new URLSearchParams(window.location.search);
        const blockedUrl = params.get('url') || 'Unknown URL';
        document.getElementById('blocked-url-display').textContent = blockedUrl;

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            }
        }
    </script>
</body>

</html>

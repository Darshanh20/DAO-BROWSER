<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Error - D.A.O. Browser</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 40px;
            position: relative;
        }

        /* Container for centered content */
        .error-container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* Status pill */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #1a2a3a;
            border-radius: 20px;
            padding: 8px 16px;
            margin-bottom: 32px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #3b82f6;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #3b82f6;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Title */
        h1 {
            font-size: 42px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        /* Subtitle */
        .subtitle {
            font-size: 15px;
            color: #555555;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        /* URL section */
        .url-section {
            width: 100%;
            margin-bottom: 24px;
            text-align: left;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555555;
            margin-bottom: 8px;
            display: block;
        }

        .url-display {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #666666;
            padding-left: 16px;
            border-left: 2px solid #2a2a2a;
            word-break: break-all;
            line-height: 1.5;
        }

        /* Error details section */
        .error-section {
            width: 100%;
            margin-bottom: 24px;
            text-align: left;
        }

        .error-display {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #666666;
            padding-left: 16px;
            border-left: 2px solid #3b82f6;
            word-break: break-all;
            line-height: 1.5;
        }

        .error-code {
            color: #3b82f6;
            font-weight: 600;
        }

        /* Thin divider */
        .divider {
            width: 40px;
            height: 1px;
            background: #1e1e1e;
            margin: 0 auto 32px;
        }

        /* Info row */
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 48px;
            text-align: left;
        }

        .info-icon {
            font-size: 16px;
            color: #3b6894;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .info-text {
            font-size: 13px;
            color: #3b6894;
            line-height: 1.5;
        }

        /* Button */
        .btn-reload {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #39ff14;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.3px;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-reload:hover {
            background: #0a1a00;
            border-color: #39ff14;
        }

        .btn-reload:active {
            opacity: 0.85;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #2a2a2a;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 20px;
            }

            .error-container {
                max-width: 100%;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 14px;
                max-width: 100%;
                margin-bottom: 32px;
            }

            .url-section,
            .error-section {
                margin-bottom: 20px;
            }

            .section-label {
                font-size: 10px;
            }

            .url-display,
            .error-display {
                font-size: 12px;
                padding-left: 12px;
            }

            .info-row {
                margin-bottom: 40px;
            }

            .info-text {
                font-size: 12px;
            }

            .btn-reload {
                padding: 10px 20px;
                font-size: 13px;
            }

            .footer {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <!-- Status Pill -->
        <div class="status-pill">
            <span class="status-dot"></span>
            Connection Error
        </div>

        <!-- Title -->
        <h1>Page Unavailable</h1>

        <!-- Subtitle -->
        <p class="subtitle">Unable to establish a connection to this page.</p>

        <!-- URL Section -->
        <div class="url-section">
            <label class="section-label">Requested URL</label>
            <div class="url-display" id="error-url-display">Unknown</div>
        </div>

        <!-- Error Section -->
        <div class="error-section">
            <label class="section-label">Error Details</label>
            <div class="error-display">
                <span class="error-code" id="error-code-display">ERR_UNKNOWN</span>
                <span id="error-message-display"></span>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Info Row -->
        <div class="info-row">
            <i class="fas fa-circle-info info-icon"></i>
            <div class="info-text" id="error-hint">Check your internet connection and try again.</div>
        </div>

        <!-- Reload Button -->
        <button class="btn-reload" onclick="reloadPage()">
            <i class="fas fa-rotate-right"></i>
            Try Again
        </button>
    </div>

    <!-- Footer -->
    <div class="footer">D.A.O. Browser</div>

    <script>
        // Extract URL parameters
        const params = new URLSearchParams(window.location.search);
        const errorCode = params.get('code') || 'UNKNOWN';
        const errorMessage = params.get('message') || 'An unexpected error occurred';
        const errorUrl = params.get('url') || 'Unknown URL';

        // Error hints based on error code
        const errorHints = {
            '-106': 'This site may be blocked by your firewall or network settings.',
            '-105': 'The server could not be found. Check the URL and try again.',
            '-104': 'The connection was reset. The server may be temporarily unavailable.',
            '-103': 'Too many redirects. The page may have a configuration issue.',
            '-102': 'Connection refused. The server is not accepting connections.',
            '-101': 'Connection reset. Try refreshing the page.',
            '-100': 'Connection closed. The server ended the connection unexpectedly.',
            '-3': 'Navigation was cancelled.',
            '-2': 'The request failed. Check your connection.',
            '-1': 'Network error. Verify your internet connection.',
            '-7': 'Connection timed out. The server took too long to respond.',
            '-21': 'Network changed during the request. Try again.',
            '-137': 'Name resolution failed. DNS could not resolve this address.',
            '-118': 'Connection timed out.',
        };

        // Update DOM
        document.getElementById('error-url-display').textContent = errorUrl;
        document.getElementById('error-code-display').textContent = `ERR_${Math.abs(parseInt(errorCode)) || errorCode}`;

        if (errorMessage && errorMessage !== 'An unexpected error occurred') {
            document.getElementById('error-message-display').textContent = ` - ${errorMessage}`;
        }

        const hint = errorHints[errorCode] || 'Check your internet connection and try again.';
        document.getElementById('error-hint').textContent = hint;

        // Button function
        function reloadPage() {
            window.location.reload();
        }

        // Allow back navigation
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        // Expose goBack to parent window for keyboard shortcuts
        if (window.parent && window.parent !== window) {
            window.parent.errorPageGoBack = goBack;
        }
    </script>
</body>

</html>

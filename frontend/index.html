<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DAO Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Tabs Bar -->
<div class="tabs-bar">
  <div class="tabs-container" id="tabsContainer">
    <!-- Tabs will be added here dynamically -->
  </div>
  <button id="newTabBtn" class="new-tab-btn" title="New Tab (Ctrl+T)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
  </button>
</div>

<div class="toolbar">
  <!-- Navigation Buttons -->
  <div class="nav-buttons">
    <button id="backBtn" class="nav-btn" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <button id="forwardBtn" class="nav-btn" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
      </svg>
    </button>
    <button id="reloadBtn" class="nav-btn" title="Reload (Ctrl+R)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.31 0 6.16-2.04 7.45-4.9h-2.16c-1.04 1.86-3.02 3.13-5.29 3.13-3.49 0-6.32-2.83-6.32-6.32s2.83-6.32 6.32-6.32c1.66 0 3.14.69 4.22 1.78l-2.58 2.58h6v-6l-2.35 2.35z"/>
      </svg>
    </button>
  </div>

  <!-- Address Bar -->
  <div class="address-bar-container">
    <input 
      id="urlBar" 
      class="address-bar"
      type="text"
      placeholder="Search or enter address" 
      spellcheck="false"
    />
  </div>
  
  <!-- Ad-Blocker Toggle + Stats -->
  <div id="blockerToggle" class="blocker-toggle" title="Toggle ad-blocker">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
    </svg>
  </div>
  
  <!-- Ad-Blocker Stats -->
  <div id="blockerStats" class="blocker-stats" title="Ads and trackers blocked">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M12 1C5.92 1 1 5.92 1 12s4.92 11 11 11 11-4.92 11-11S18.08 1 12 1zm0 2c4.97 0 9 4.03 9 9s-4.03 9-9 9-9-4.03-9-9 4.03-9 9-9zm3.5 11c.83 0 1.5-.67 1.5-1.5S16.33 11 15.5 11 14 11.67 14 12.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 11 8.5 11 7 11.67 7 12.5 7.67 14 8.5 14z"/>
    </svg>
    <span id="blockerCount" class="blocker-count">0</span>
  </div>
</div>

<!-- Browser Views Container -->
<div class="browser-container" id="browserContainer">
  <!-- Webviews will be added here dynamically -->
</div>

<script src="renderer.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>AI Privacy Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    #urlBar {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      flex-shrink: 0;
    }
    webview {
      flex: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<input id="urlBar" placeholder="Enter URL and press Enter" />
<webview id="browserView" src="https://www.google.com"></webview>

<script>
  const urlBar = document.getElementById("urlBar");
  const browserView = document.getElementById("browserView");

  urlBar.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      let url = urlBar.value;
      if (!url.startsWith("http")) {
        url = "https://" + url;
      }
      browserView.src = url;
    }
  });
</script>

</body>
</html>
